<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ramayan Wall Mapper</title>
<style>
  :root { --ui-bg: rgba(20,12,30,.82); --ui-border: rgba(255,190,110,.35); --ui-text: #ffe8c7; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
           -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body.hide-cursor canvas { cursor: none; }
  #ui { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; width: max-content; max-width: calc(100vw - 20px);
        padding: 7px; border-radius: 14px; background: var(--ui-bg); border: 1px solid var(--ui-border);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .6s; z-index: 5; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui button { font: inherit; color: var(--ui-text); background: rgba(255,255,255,.06); border: 1px solid var(--ui-border);
               border-radius: 9px; padding: 9px 10px; cursor: pointer; white-space: nowrap; }
  #ui button:hover { background: rgba(255,179,71,.2); }
  #ui button[aria-pressed="true"] { background: rgba(255,179,71,.32); border-color: #ffb347; }
  #ui button.rec { border-color: #ff6b6b; color: #ffd0d0; }
  #ui .sep { width: 1px; align-self: stretch; background: var(--ui-border); margin: 2px; }
  #ui .lbl { color: #c9b08a; font-size: 12px; padding: 0 2px; }
  #hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: min(720px, 90vw);
          color: var(--ui-text); text-align: center; font: 14px/1.5 system-ui, -apple-system, sans-serif;
          background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; pointer-events: none; transition: opacity .6s; z-index: 4; }
  #hint.hidden { opacity: 0; }
  #panel { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); z-index: 9; }
  #panel.open { display: grid; }
  #panel div { width: min(620px, 92vw); background: #1b1226; border: 1px solid var(--ui-border); border-radius: 14px; padding: 14px; color: var(--ui-text);
               font: 14px/1.5 system-ui, sans-serif; }
  #panel textarea { width: 100%; height: 190px; box-sizing: border-box; background: #0d0814; color: #ffe8c7; border: 1px solid var(--ui-border);
                    border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #panel button { font: inherit; color: var(--ui-text); background: rgba(255,255,255,.08); border: 1px solid var(--ui-border); border-radius: 9px; padding: 9px 12px; margin: 8px 6px 0 0; cursor: pointer; }
  #soundHint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 8; font: 600 20px/1 system-ui, sans-serif; color: #2a1404;
               background: linear-gradient(#ffe7a8, #ffb347); border: 0; border-radius: 999px; padding: 14px 26px; box-shadow: 0 0 30px rgba(255,170,60,.6); cursor: pointer; }
  #soundHint[hidden] { display: none; }
  #err { position: fixed; top: 8px; left: 8px; right: 8px; color: #ffb4b4; font: 12px/1.4 monospace; pointer-events: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<button id="soundHint" hidden>🔊 Tap for the story narration</button>
<div id="err" hidden></div>
<div id="panel"><div>
  <b>Layout</b> — copy this text to keep your fit, or paste a saved one and press Apply.
  <textarea id="json" spellcheck="false"></textarea>
  <button id="jCopy">Copy</button><button id="jApply">Apply</button><button id="jClose">Close</button>
  <span id="jMsg"></span>
</div></div>
<div id="ui">
  <button id="mEdit" aria-pressed="true" title="Drag corners (E)">Edit</button>
  <button id="mTest" aria-pressed="false" title="Bright panels to line up (T)">Test</button>
  <button id="mPlay" aria-pressed="false" title="Show the journey (P)">Play</button>
  <span class="sep"></span>
  <button id="bAdd">+ Surface</button>
  <button id="bAddText" title="Add an area where the story is written out">+ Text</button>
  <button id="bDel">− Surface</button>
  <span class="sep"></span>
  <span class="lbl">Art / ground</span>
  <button id="bSmall" title="Smaller picture">−</button><button id="bBig" title="Bigger picture">+</button>
  <button id="bUp" title="Raise the ground line the characters stand on">▲</button><button id="bDown" title="Lower the ground line">▼</button>
  <span class="lbl">Tall</span>
  <button id="bTall0" title="Characters less tall">−</button><button id="bTall1" title="Characters taller: use when the projector squashes the picture">+</button>
  <span class="lbl">Edge</span>
  <button id="bIn0" title="Smaller inset">−</button><button id="bIn1" title="Pull edges inward to avoid light spill">+</button>
  <span class="sep"></span>
  <button id="bPrev">◀ Scene</button><button id="bNext">Scene ▶</button><button id="bPlay">⏸ Pause</button>
  <span class="sep"></span>
  <button id="bJson">Layout…</button>
  <button id="bRec">⏺ Record video</button>
  <button id="bFull">⛶ Fullscreen</button>
  <button id="bSound" title="Narration: a voice reads the story (S)">🔇 Sound off</button>
  <button id="bLook" title="Night: only light is shown, for the wall. Day: painted sky, for a screen.">Look: 3D</button>
  <button id="bView" title="Switch between the band above the doors and separate door windows">View: Frieze</button>
  <button id="bReset">Reset</button>
</div>
<script src="../vendor/three.min.js"></script>
<script src="../vendor/CopyShader.js"></script>
<script src="../vendor/LuminosityHighPassShader.js"></script>
<script src="../vendor/EffectComposer.js"></script>
<script src="../vendor/RenderPass.js"></script>
<script src="../vendor/ShaderPass.js"></script>
<script src="../vendor/MaskPass.js"></script>
<script src="../vendor/UnrealBloomPass.js"></script>
<script src="../vendor/fonts.js"></script>
<script src="narration-times.js"></script>
<script src="../vendor/photos.js"></script>
<script src="intro.js"></script>
<script src="outro.js"></script>
<script src="r3.js"></script>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- constants ----------
  const PW = 1200, PH = 400, GY = 345;        // one scene is 1200 x 400 (3:1); ground line at y = 345
  // Night look (default): a projector can only add light, so figures are drawn as lit gold shapes on black and the sky is not drawn at all.
  // Day look: dark silhouettes against a painted sky (for a screen, not a wall).
  let INK = '#0a0409', DIM = INK, MID = INK, RAV = INK, NIGHT = false;
  function setLook(night) {
    NIGHT = night;
    if (night) { INK = '#ffd48a'; DIM = '#5e3412'; MID = '#a8652a'; RAV = '#ff6a3a'; }
    else { INK = '#0a0409'; DIM = MID = RAV = INK; }
  }
  const HOLD = 11, PAN = 2.5, SEG = HOLD + PAN, NP = 5;
  const LOOP = (NP - 1) * SEG + HOLD + PAN;   // 67.5 s
  const GOLD = '#ffcf70';

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- state ----------
  let W = 0, H = 0, DPR = 1;
  let T = 0, paused = false, flash = 0;
  let fired = {}, parts = [];
  const query = new URLSearchParams(location.search);

  // Surfaces are four-corner shapes in the projector picture, as fractions of its width and height.
  // The default layout is a first guess from the room video: left door, the wall between, right door.
  // 'frieze': one long band in the gap between the ceiling and the tops of the doors, all five scenes side by side.
  // 'doors':  separate windows on the left door, the wall and the right door, with the story panning across them.
  const SURFACES = {
    frieze: () => [
      { name: 'Above doors', pts: [[.012, .01], [.988, .01], [.988, .145], [.012, .145]] },
      { name: 'Story text', role: 'text', pts: [[.34, .27], [.68, .27], [.68, .55], [.34, .55]] },   // blank wall between the doors
    ],
    doors: () => [
      { name: 'Left door',  pts: [[.081, .214], [.308, .219], [.308, .99], [.081, .99]] },
      { name: 'Wall',       pts: [[.337, .02], [.685, .02], [.685, .98], [.337, .98]] },
      { name: 'Right door', pts: [[.702, .223], [.885, .227], [.885, .99], [.702, .99]] },
    ],
  };
  const PRESET = {
    frieze: { win: 6320, ground: .122, vstretch: 2, inset: 1 },
    doors:  { win: 1400, ground: .92,  vstretch: 2, inset: 2 },
  };
  const cfg = { view: 'frieze', look: '3d', surfaces: SURFACES.frieze(), ...PRESET.frieze, captions: false };
  const applyPreset = (v) => { cfg.view = v; cfg.surfaces = SURFACES[v](); Object.assign(cfg, PRESET[v]); };
  const validLayout = (o) => o && Array.isArray(o.surfaces) && o.surfaces.length > 0 && o.surfaces.every(s =>
    s && Array.isArray(s.pts) && s.pts.length === 4 && s.pts.every(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1])));
  const applyLayout = (o) => {
    if (!validLayout(o)) return false;
    cfg.surfaces = o.surfaces.map((s, i) => ({ name: String(s.name || 'Surface ' + (i + 1)).slice(0, 30), pts: s.pts.map(p => [+p[0], +p[1]]), ...(s.role === 'text' ? { role: 'text' } : {}) }));
    cfg.view = o.view in SURFACES ? o.view : 'doors';
    cfg.look = o.look === 'day' ? 'day' : (o.look === 'night' ? 'night' : '3d');
    for (const k of ['win', 'ground', 'vstretch', 'inset']) if (isFinite(o[k])) cfg[k] = +o[k];
    return true;
  };
  const layoutJSON = () => JSON.stringify({ view: cfg.view, look: cfg.look, surfaces: cfg.surfaces, win: Math.round(cfg.win), ground: Math.round(cfg.ground * 1000) / 1000, vstretch: Math.round(cfg.vstretch * 100) / 100, inset: cfg.inset });
  try { applyLayout(JSON.parse(localStorage.getItem('wall-map-v1') || 'null')); } catch (_) {}
  const saveCfg = () => { try { localStorage.setItem('wall-map-v1', layoutJSON()); } catch (_) {} };
  try { const h = location.hash.match(/layout=([^&]+)/); if (h) applyLayout(JSON.parse(atob(decodeURIComponent(h[1])))); } catch (_) {}
  // ?cinema: a full-screen version for a TV, a tablet or a plain wall: the camera follows the story, which fills the screen, with the text along the bottom
  if (new URLSearchParams(location.search).has('cinema')) applyLayout({ view: 'doors', look: '3d', surfaces: [{ name: 'Screen', pts: [[0, 0], [1, 0], [1, .8], [0, .8]] }, { name: 'Story text', role: 'text', pts: [[.03, .805], [.97, .805], [.97, .995], [.03, .995]] }], win: 820, ground: .77, vstretch: 1, inset: 0 });

  // ---------- palettes (top, middle, bottom) per scene ----------
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const PAL = [
    ['#2b1a4a', '#d4603a', '#ffcf70'],  // dawn in Ayodhya
    ['#3b1d5a', '#b3475a', '#f6a35a'],  // court of Mithila
    ['#14243a', '#6b4a5a', '#e6a055'],  // forest dusk
    ['#12040c', '#7a1620', '#ff7a2a'],  // Lanka night
    ['#05030f', '#2a1250', '#ff9a3c'],  // Diwali night
  ].map(p => p.map(hex));
  const STARS = [0.05, 0.1, 0.25, 0.7, 1];

  const mixc = (a, b, t) => `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;

  function drawBackground(x0, x1) {
    if (NIGHT) return;   // no sky: nothing is projected where there is no light
    const step = Math.max(12, Math.round((x1 - x0) / 180));
    for (let x = x0 - (x0 % step) - step; x < x1 + step; x += step) {
      const u = clamp((x + step / 2) / PW - 0.5, 0, NP - 1);
      const j = Math.min(NP - 2, Math.floor(u));
      const f = sstep(0.3, 0.7, u - j);
      const g = ctx.createLinearGradient(0, 0, 0, PH);
      g.addColorStop(0, mixc(PAL[j][0], PAL[j + 1][0], f));
      g.addColorStop(0.62, mixc(PAL[j][1], PAL[j + 1][1], f));
      g.addColorStop(GY / PH, mixc(PAL[j][2], PAL[j + 1][2], f));
      g.addColorStop(1, '#000');
      ctx.fillStyle = mixc(PAL[j][0], PAL[j + 1][0], f);
      ctx.fillRect(x, -1500, step + 3, 1500);   // sky continues above the scene
      ctx.fillStyle = g;
      ctx.fillRect(x, 0, step + 3, PH);
    }
  }

  // stars across the whole world
  const stars = Array.from({ length: 260 }, () => ({
    x: Math.random() * PW * NP, y: rand(-420, 250), r: Math.random() < .9 ? rand(.5, 1.2) : rand(1.2, 2),
    ph: Math.random() * 6.28, sp: rand(.6, 2),
  }));
  function drawStars(x0, x1, t) {
    if (NIGHT) return;
    for (const s of stars) {
      if (s.x < x0 - 5 || s.x > x1 + 5) continue;
      const u = clamp(s.x / PW - 0.5, 0, NP - 1), j = Math.min(NP - 2, Math.floor(u));
      const base = lerp(STARS[j], STARS[j + 1], sstep(.3, .7, u - j));
      if (base < .03) continue;
      ctx.globalAlpha = base * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
      ctx.fillStyle = '#fff5e1';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- drawing helpers ----------
  function glow(x, y, r, col, a) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
  }
  function celestial(x, y, r, fill, gcol) {
    if (NIGHT) r *= .6;
    glow(x, y, r * 4.5, gcol, NIGHT ? .3 : .45);
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
  function ground() {
    if (NIGHT) {   // only a thin glowing line, so the characters have something to stand on
      const g = ctx.createLinearGradient(0, GY, 0, GY + 14);
      g.addColorStop(0, 'rgba(255,170,70,.75)'); g.addColorStop(1, 'rgba(255,170,70,0)');
      ctx.fillStyle = g; ctx.fillRect(-2, GY, PW + 4, 14); return;
    }
    ctx.fillStyle = INK;
    ctx.fillRect(-2, GY, PW + 4, 900);
  }

  // ---------- characters: painted in the style of an Indian miniature, facing right (flip to face left) ----------
  const WHO = {
    ram:      { skin: '#58a6ea', edge: '#2c5c99', dress: '#ffd23a', fold: '#b98a14', sash: '#e8503a', hair: '#27307a', crown: 1, quiver: 1 },
    lakshman: { skin: '#eeaa72', edge: '#a2653a', dress: '#fff0d0', fold: '#b9a47a', sash: '#35c46a', hair: '#4a2c1c', crown: 1, quiver: 1 },
    sita:     { skin: '#f2b98f', edge: '#b0714a', dress: '#2fbf71', fold: '#16804a', sash: '#ffd23a', hair: '#4a2c1c', female: 1 },
  };
  const JEWEL = '#ffd84a', RUBY = '#ff3b4a';
  function limb(x0, y0, x1, y1, w0, w1) {   // a tapered arm or leg
    const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy) || 1, nx = -dy / d, ny = dx / d;
    ctx.beginPath(); ctx.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2); ctx.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
    ctx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2); ctx.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(x0, y0, w0 / 2, 0, 6.283); ctx.arc(x1, y1, w1 / 2, 0, 6.283); ctx.fill();
  }
  function band(x, y, ang, len, w, col) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col; ctx.fillRect(-len / 2, -w / 2, len, w); ctx.restore(); }

  function figure(x, y, s, o) {
    o = o || {};
    const who = o.who || (o.female ? 'sita' : 'ram'), C = WHO[who], fem = !!C.female;
    s *= cfg.view === 'frieze' ? .8 : 1;
    const dir = o.flip ? -1 : 1, w = o.walk || 0, mv = !!o.moving;
    const sw = mv ? Math.sin(w) : 0, bob = mv ? Math.abs(Math.cos(w)) * 3 : 0;
    ctx.save(); ctx.translate(x, y - bob * s); ctx.scale(s * dir, s);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // hands: where the arms reach
    let fh = [15 + sw * 9, -62], bh = [-15 - sw * 9, -62];
    const d = o.bow;
    if (d !== undefined) { fh = [38, -112]; bh = d > 0.02 ? [38 - 30 * d, -112] : [18, -98]; }
    if (o.hands) { fh = o.hands[0]; bh = o.hands[1]; }

    const arm = (sh, h, front) => {
      const e = [(sh[0] + h[0]) / 2 + (front ? 1 : -1), (sh[1] + h[1]) / 2 + 7];
      ctx.fillStyle = C.skin; limb(sh[0], sh[1], e[0], e[1], 8.4, 6.8); limb(e[0], e[1], h[0], h[1], 6.8, 5);
      ctx.beginPath(); ctx.arc(h[0], h[1], 3.3, 0, 6.283); ctx.fill();
      const ax = lerp(sh[0], e[0], .5), ay = lerp(sh[1], e[1], .5);   // armlet and bangles
      ctx.strokeStyle = JEWEL; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(ax - 4, ay); ctx.lineTo(ax + 4, ay + .5); ctx.stroke();
      const bx = lerp(e[0], h[0], .82), by = lerp(e[1], h[1], .82);
      ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(bx - 3.4, by); ctx.lineTo(bx + 3.4, by + .4); ctx.stroke();
    };

    // quiver of arrows behind the shoulder
    if (C.quiver) {
      ctx.save(); ctx.translate(-13, -104); ctx.rotate(-.16);
      ctx.fillStyle = '#a8652a'; ctx.fillRect(-3.4, -4, 7, 36); ctx.fillStyle = JEWEL; ctx.fillRect(-3.4, 8, 7, 2.4); ctx.fillRect(-3.4, 24, 7, 2.4);
      ctx.strokeStyle = '#fff6df'; ctx.lineWidth = 1.2; for (const k of [-2, 0, 2]) { ctx.beginPath(); ctx.moveTo(k, -4); ctx.lineTo(k - 1, -12); ctx.stroke(); }
      ctx.restore();
    }
    arm([-10, -114], bh, false);   // far arm

    // legs and feet
    ctx.fillStyle = C.skin;
    for (const g of [1, -1]) {
      const fx = g * 4 + g * sw * 24;
      limb(g * 4, -76, fx, -5, 9.5, 5.6);
      ctx.beginPath(); ctx.ellipse(fx + 3, -1.8, 5.4, 2.3, 0, 0, 6.283); ctx.fill();
      ctx.strokeStyle = JEWEL; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.moveTo(fx - 3, -7); ctx.lineTo(fx + 3, -7); ctx.stroke();
    }

    // dhoti (men) or saree (Sita)
    const hem = fem ? -5 : -26, wd = fem ? 21 : 16.5;
    ctx.fillStyle = C.dress; ctx.strokeStyle = C.fold; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-12, -88); ctx.lineTo(12, -88); ctx.lineTo(wd + sw * 3, hem);
    ctx.quadraticCurveTo(4 + sw * 3, hem + 4, -wd + sw * 3, hem); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.fold; ctx.lineWidth = .9;
    for (const k of [-6, -1.5, 3, 7.5]) { ctx.beginPath(); ctx.moveTo(k, -86); ctx.quadraticCurveTo(k * 1.6 + sw * 2, (hem - 86) / 2, k * 2.1 + sw * 3, hem); ctx.stroke(); }
    if (!fem) {   // fluttering end of the cloth
      ctx.fillStyle = C.dress; ctx.beginPath(); ctx.moveTo(-11, -86); ctx.quadraticCurveTo(-22, -70 + sw * 4, -25 - sw * 3, -48); ctx.lineTo(-12, -62); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = C.fold; ctx.stroke();
    } else {      // gold border of the saree
      ctx.strokeStyle = JEWEL; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(-wd + sw * 3, hem - 1); ctx.quadraticCurveTo(4 + sw * 3, hem + 3, wd + sw * 3, hem - 1); ctx.stroke();
    }
    // belt
    ctx.fillStyle = JEWEL; ctx.fillRect(-12.5, -90, 25, 4.4); ctx.fillStyle = RUBY; ctx.beginPath(); ctx.arc(0, -87.8, 1.6, 0, 6.283); ctx.fill();

    // chest
    if (fem) {
      ctx.fillStyle = C.skin; ctx.fillRect(-9, -100, 18, 12);
      ctx.fillStyle = '#ff6a3a'; ctx.beginPath(); ctx.moveTo(-13, -120); ctx.lineTo(13, -120); ctx.lineTo(9.5, -98); ctx.lineTo(-9.5, -98); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = JEWEL; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-9.5, -98); ctx.lineTo(9.5, -98); ctx.stroke();
      // pallu draped from the shoulder
      ctx.fillStyle = C.dress; ctx.strokeStyle = C.fold; ctx.lineWidth = .9;
      ctx.beginPath(); ctx.moveTo(6, -121); ctx.quadraticCurveTo(-12, -108, -14, -94); ctx.quadraticCurveTo(-26 - sw * 3, -78, -22 - sw * 4, -52); ctx.lineTo(-11, -90); ctx.quadraticCurveTo(-6, -104, 6, -121); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.fillStyle = C.skin; ctx.strokeStyle = C.edge; ctx.lineWidth = .9;

      } else if (p.k === 'ember') {

        ctx.fillStyle = `rgba(255,${Math.round(120 + k * 110)},60,${(k * .9).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (.5 + k) * SZ(), 0, 6.283); ctx.fill();

  // ---------- scene timeline ----------
  const ltOf = (i) => i === 0 ? T : T - (i * SEG - 1.5);
  // The camera follows the action: where in each scene (in scene pixels) the middle of the picture points.
  function focus(i, lt) {
    lt = Math.max(0, lt);
    if (i === 0) return 740;
    if (i === 1) return lerp(430, 650, sstep(2.5, 7.5, lt));
    if (i === 2) return clamp(lerp(-300, 1130, sstep(.3, 11.5, lt)) - 90, 380, 820);
    if (i === 3) return 650;
    return 650;
  }
  function camCenter() {
    const seg = Math.floor(T / SEG), u = T - seg * SEG;
    const c = (i) => i * PW + focus(i, ltOf(i));
    if (seg >= NP - 1 || u < HOLD) return c(Math.min(seg, NP - 1));
    return lerp(c(seg), c(seg + 1), sstep(0, 1, (u - HOLD) / PAN));
  }

  const P3 = { ramX: 230, ramS: 1.35, ravX: 930, get ravS() { return cfg.view === 'frieze' ? .95 : 1.3; } };
  function arrowPos(lt) {
    const p = (lt - 4.0) / 0.9; if (p < 0 || p >= 1) return null;
    const x0 = P3.ramX + P3.ramS * FS() * 8, y0 = GY - P3.ramS * FS() * 112, x1 = P3.ravX - 30, y1 = GY - P3.ravS * 100;
    const e = p * p * .4 + p * .6;
    return { x: lerp(x0, x1, e), y: lerp(y0, y1, e) - Math.sin(Math.PI * p) * 16, a: Math.atan2((y1 - y0) / (x1 - x0) - Math.cos(Math.PI * p) * 0.12, 1) };
  }

  const once = (name, cond, fn) => { if (cond && !fired[name]) { fired[name] = 1; fn(); } };

  function resetWorld() { fired = {}; parts = []; flash = 0; }

  function update(dt) {
    T += dt;
    if (cfg.look === '3d' && window.R3) { if (T >= R3.LOOP) { T -= R3.LOOP; resetWorld(); } R3.update(T, dt); return; }
    if (T >= LOOP) { T -= LOOP; resetWorld(); }
    flash = Math.max(0, flash - dt * 1.6);
    const l0 = ltOf(0), l1 = ltOf(1), l3 = ltOf(3), l4 = ltOf(4);
    const o1 = PW, o3 = PW * 3, o4 = PW * 4;

    once('lotus', l0 >= 5.2, () => { burst(380, 270, 45, 90); ring(380, 290, '255,215,120'); petalRain(120, 1100, 36); flash = .35; });
    once('p0fw1', l0 >= 8.0, () => burst(760, 120, 330, 100));
    once('p0fw2', l0 >= 9.0, () => burst(980, 150, 45, 100));

    once('snap', l1 >= 6.0, () => { flash = 1; burst(o1 + 606, 211, 45, 130); ring(o1 + 606, 211, '255,230,170'); petalRain(o1 + 80, o1 + 1120, 70); });

    if (l3 > 4.0 && l3 < 4.9) { const a = arrowPos(l3); if (a) for (let i = 0; i < 3; i++) ember(o3 + a.x - 8, a.y, true); }
    once('hit', l3 >= 4.9, () => { flash = .9; ring(o3 + 905, GY - 160, '255,160,70'); burst(o3 + 905, GY - 160, 20, 140); });
    once('r2', l3 >= 5.5, () => burst(o3 + 860, GY - 250, 45, 110));
    once('r3', l3 >= 6.2, () => burst(o3 + 1010, GY - 210, 340, 110));
    once('r4', l3 >= 7.0, () => burst(o3 + 930, GY - 120, 200, 110));
    once('r5', l3 >= 8.0, () => burst(o3 + 700, 120, 45, 110));
    if (l3 > 4.9 && l3 < 9.2) for (let i = 0; i < 4; i++) ember(o3 + P3.ravX + rand(-40, 40) * 1.2, GY - rand(10, 230), true);
    if (l3 > 9.0 && l3 < 12) for (let i = 0; i < 2; i++) ember(o3 + P3.ravX + rand(-50, 50), GY - rand(0, 40), false);

    for (const [k, t] of [[0, 3.0], [1, 3.9], [2, 4.8], [3, 5.8], [4, 6.6], [5, 7.5], [6, 8.4], [7, 9.3], [8, 10.2]])
      once('p4fw' + k, l4 >= t, () => burst(o4 + rand(160, 1040), rand(60, 200), [45, 330, 200, 120, 15, 280][k % 6], 105));
    once('p4petal', l4 >= 6.0, () => petalRain(o4 + 100, o4 + 1100, 50));

    updateParts(dt);
  }

        ctx.strokeStyle = GOLD; ctx.lineWidth = 1.6; ctx.stroke();
      }

      if (lt > 9) glow(580, GY - 130, 150 * sstep(9, 10.5, lt), '255,200,120', .35);

      for (const [x, h, w] of [[80, 190, 120], [250, 230, 140], [430, 180, 110], [620, 220, 140], [820, 200, 120], [1010, 240, 150], [1160, 190, 110]]) tree(x, h, .3, w);

      for (const [x, h, w] of [[30, 330, 170], [330, 290, 140], [560, 310, 160], [930, 300, 150], [1160, 335, 180]]) tree(x, h, 1, w);

      ctx.save(); ctx.globalAlpha = .55; ctx.fillStyle = DIM;
      for (let k = 0; k < 14; k++) { const bx = 560 + k * 48, bh = 70 + ((k * 53) % 90); ctx.fillRect(bx, GY - bh, 38, bh); if (k % 3 === 0) { ctx.beginPath(); ctx.arc(bx + 19, GY - bh, 19, Math.PI, 0); ctx.fill(); } }
      ctx.restore();

      figure(110, GY, 1.2, { who: 'lakshman', crown: true, hands: lt > 1 ? [[16, -95], [-10, -90]] : undefined });
      const dr = lt < 4.0 ? sstep(1.0, 3.8, lt) : 1 - sstep(4.0, 4.15, lt);
      figure(P3.ramX, GY, P3.ramS, { crown: true, bow: dr, bowSize: 1.15, arrow: lt < 4.0 && dr > .05 });
      const burn = sstep(4.9, 9.5, lt);
      if (lt > 4.9) { glow(P3.ravX, GY - 120, 240 * (1 - burn * .6), '255,120,40', .45 * (1 - burn * .5)); }
      const shake = lt > 4.9 && lt < 8 ? Math.sin(t * 60) * 2.5 * (1 - burn) : 0;

      const a = arrowPos(lt);
      if (a) {

        ctx.strokeStyle = '#2a1408'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(8, 0); ctx.stroke();
        ctx.fillStyle = '#fff1b0'; ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(6, -4.5); ctx.lineTo(6, 4.5); ctx.closePath(); ctx.fill();

    else {
      celestial(1030, 92, 34, '#fff4dc', '255,240,210');
      palace(640, GY, 1.4, 1, t);
      for (let k = 0; k < 9; k++) lantern(110 + k * 125, GY - (((lt * 20 + k * 61) % 420)), 13 + (k % 3) * 4, sstep(.5, 2, lt) * clamp((GY - (((lt * 20 + k * 61) % 420))) / 90), t, k);

      for (let k = 0; k < 24; k++) diya(30 + k * 50, GY + 2 + (k % 2) * 3, sstep(.4 + k * .22, .8 + k * .22, lt), t, k);

      figure(wp, GY, 1.2, { crown: true, walk: ph, moving: mv });
      figure(wp - 100, GY, 1.1, { female: true, walk: ph + 1, moving: mv });
      figure(wp - 205, GY, 1.15, { who: 'lakshman', crown: true, walk: ph + 2, moving: mv });

        const fz = cfg.view === 'frieze';
        ctx.font = (fz ? '700 36px' : '700 64px') + ' "Noto Sans Devanagari", "Mangal", Georgia, serif';
        ctx.shadowColor = 'rgba(255,170,60,.95)'; ctx.shadowBlur = 26; ctx.fillStyle = '#ffe9b0';
        ctx.fillText('Happy Diwali', fz ? 880 : 650, fz ? 196 : 100);

  }

  // ---------- layout and loop ----------
  let mode = 'edit', sel = 0;
  const modeBtn = { edit: document.getElementById('mEdit'), test: document.getElementById('mTest'), play: document.getElementById('mPlay') };
  const hint = document.getElementById('hint'), ui = document.getElementById('ui');
  const HINTS = {
    edit: 'Edit: drag the corner dots so the shape sits exactly in the space you want to light (the gap between the ceiling and the doors). Drag inside a shape to move it. + Surface adds more.',
    test: 'Test: bright panel. Line it up with the real gap above the doors. The circle should look round on the wall. If it looks wide, press Tall +. Then press Play.',
    play: '',
  };
  function setMode(m) {
    mode = m; for (const k in modeBtn) modeBtn[k].setAttribute('aria-pressed', k === m);
    hint.textContent = HINTS[m]; hint.classList.toggle('hidden', !HINTS[m]);
    try { showSoundHint(); if (m !== 'play') narr.pause(); } catch (_) { /* the narration controls are set up later */ }
  }

  function resize() {
    W = canvas.clientWidth || window.innerWidth; H = canvas.clientHeight || window.innerHeight;
    if (!W || !H) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(4.2e6 / (W * H)));
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  }

  // pixel polygons, pulled inward a little so light does not spill past the edge of a door
  function polys() {
    return cfg.surfaces.map((s) => {
      const pts = s.pts.map((p) => [p[0] * W, p[1] * H]);
      if (cfg.inset <= 0) return pts;
      const cx = pts.reduce((a, p) => a + p[0], 0) / 4, cy = pts.reduce((a, p) => a + p[1], 0) / 4;
      return pts.map(([x, y]) => { const dx = cx - x, dy = cy - y, d = Math.hypot(dx, dy) || 1, m = Math.min(cfg.inset, d * .4); return [x + dx / d * m, y + dy / d * m]; });
    });
  }
  function clipTo(P) {
    ctx.beginPath();
    for (const q of P) { ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(q[i][0], q[i][1]); ctx.closePath(); }
    ctx.clip();
  }

  // The journey: only the scene in progress is lit. Each scene fades in as the story reaches it and fades out as it moves on;
  // everything else, including the empty margins, stays dark (no light on the wall).
  const sceneWeight = (i) => sstep(i * SEG - 2.3, i * SEG - 0.8, T) * (1 - sstep(i * SEG + 10.8, i * SEG + 12.3, T));
  function sceneShade(x0, x1) {
    ctx.fillStyle = '#000';
    if (x0 < 0) ctx.fillRect(x0, -1500, -x0, 2400);
    if (x1 > NP * PW) ctx.fillRect(NP * PW, -1500, x1 - NP * PW, 2400);
    for (let i = 0; i < NP; i++) {
      const a = 1 - sceneWeight(i);
      if (a > 0.003) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, a).toFixed(3)})`; ctx.fillRect(i * PW - 1, -1500, PW + 2, 2400); }
    }
  }

  // the 3D look: Three.js renders the walk, and the lit shapes show the part of it that falls inside them
  function drawWorld3D(P) {
    if (!window.R3) return;
    const k = W / cfg.win, ky = k * cfg.vstretch, c = cfg.view === 'frieze' ? 3000 : clamp(R3.follow(T), cfg.win / 2 - 600, R3.WORLD - cfg.win / 2 + 400);
    let minY = Infinity, maxY = -Infinity;
    for (const q of P) for (const p of q) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
    minY = Math.max(0, Math.floor(minY)); maxY = Math.min(H, Math.ceil(maxY));
    if (!(maxY - minY > 3)) return;
    const gy = cfg.ground * H;
    R3.setView(c - cfg.win / 2, c + cfg.win / 2, (gy - minY) / ky, (gy - maxY) / ky, W * DPR, (maxY - minY) * DPR);
    ctx.save(); clipTo(P);
    ctx.drawImage(R3.render(), 0, minY, W, maxY - minY);
    const fade = T < 1 ? 1 - T : (T > R3.LOOP - 1.5 ? (T - (R3.LOOP - 1.5)) / 1.5 : 0);
    if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(fade).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  function drawWorld(P) {
    if (cfg.look === '3d') { drawWorld3D(P); return; }
    const fr = cfg.view === 'frieze';
    const k = W / cfg.win, c = fr ? 3000 : camCenter(), x0 = c - cfg.win / 2, x1 = c + cfg.win / 2;
    ctx.save(); clipTo(P);
    ctx.save();
    ctx.translate(0, cfg.ground * H); ctx.scale(k, k * cfg.vstretch); ctx.translate(-x0, -GY);   // the ground line of the scene sits at cfg.ground of the picture height
    drawBackground(x0, x1); drawStars(x0, x1, T);
    if (fr && !NIGHT) { ctx.fillStyle = INK; ctx.fillRect(x0, GY, x1 - x0, 900); }
    for (let i = 0; i < NP; i++) if (i * PW + PW > x0 && i * PW < x1) drawPanel(i);
    drawParts();
    if (fr) sceneShade(x0, x1);
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,236,200,${(flash * (NIGHT ? .2 : .55)).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    const fade = T < 1 ? 1 - T : (T > LOOP - 1.5 ? (T - (LOOP - 1.5)) / 1.5 : 0);
    if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(fade).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }

    setMode('play'); paused = false; bPlay.textContent = '⏸ Pause'; seek(0);
    recording = true; bRec.classList.add('rec'); showUI(); rec.start(1000);
    const t0 = performance.now(), iv = setInterval(() => {
      const left = Math.ceil((cfg.look === '3d' && window.R3 ? R3.LOOP : LOOP) + 0.5 - (performance.now() - t0) / 1000);
      bRec.textContent = '● Recording ' + Math.max(0, left) + 's';
      if (left <= 0) { clearInterval(iv); rec.stop(); }
    }, 500);
  };

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    if (k === 'e' || k === 'E') setMode('edit'); else if (k === 't' || k === 'T') setMode('test'); else if (k === 'p' || k === 'P') setMode('play');
    else if (k === 'f' || k === 'F') toggleFullscreen();
    else if (k === 's' || k === 'S') setSound(!soundOn);
    else if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k >= '1' && k <= '5') jump(+k - 1);
    else if (mode !== 'play' && k.startsWith('Arrow')) {
      const s = cfg.surfaces[sel], d = (e.shiftKey ? .02 : .004), dx = k === 'ArrowLeft' ? -d : k === 'ArrowRight' ? d : 0, dy = k === 'ArrowUp' ? -d : k === 'ArrowDown' ? d : 0;
      s.pts = s.pts.map(p => [p[0] + dx, p[1] + dy]); saveCfg(); e.preventDefault();
    } else return;
    showUI();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(canvas);
  async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (_) {} }
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());
  wake();

  setMode(query.has('play') ? 'play' : (query.get('mode') || 'edit'));
  resize();
  if (window.R3 && R3.avatarStills) try { R3.avatarStills(); } catch (e) { console.warn(e); }   // render the avatar pictures for the opening titles once, up front
  if (query.has('t')) seek(parseFloat(query.get('t')) || 0);
  if (query.has('hold')) paused = true;
  showUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
