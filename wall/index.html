<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ramayan Wall Mapper</title>
<style>
  :root { --ui-bg: rgba(20,12,30,.82); --ui-border: rgba(255,190,110,.35); --ui-text: #ffe8c7; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none;
           -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body.hide-cursor canvas { cursor: none; }
  #ui { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; width: max-content; max-width: calc(100vw - 20px);
        padding: 7px; border-radius: 14px; background: var(--ui-bg); border: 1px solid var(--ui-border);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif; transition: opacity .6s; z-index: 5; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  #ui button { font: inherit; color: var(--ui-text); background: rgba(255,255,255,.06); border: 1px solid var(--ui-border);
               border-radius: 9px; padding: 9px 10px; cursor: pointer; white-space: nowrap; }
  #ui button:hover { background: rgba(255,179,71,.2); }
  #ui button[aria-pressed="true"] { background: rgba(255,179,71,.32); border-color: #ffb347; }
  #ui button.rec { border-color: #ff6b6b; color: #ffd0d0; }
  #ui .sep { width: 1px; align-self: stretch; background: var(--ui-border); margin: 2px; }
  #ui .lbl { color: #c9b08a; font-size: 12px; padding: 0 2px; }
  #hint { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: min(720px, 90vw);
          color: var(--ui-text); text-align: center; font: 14px/1.5 system-ui, -apple-system, sans-serif;
          background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 10px; pointer-events: none; transition: opacity .6s; z-index: 4; }
  #hint.hidden { opacity: 0; }
  #panel { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.7); z-index: 9; }
  #panel.open { display: grid; }
  #panel div { width: min(620px, 92vw); background: #1b1226; border: 1px solid var(--ui-border); border-radius: 14px; padding: 14px; color: var(--ui-text);
               font: 14px/1.5 system-ui, sans-serif; }
  #panel textarea { width: 100%; height: 190px; box-sizing: border-box; background: #0d0814; color: #ffe8c7; border: 1px solid var(--ui-border);
                    border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #panel button { font: inherit; color: var(--ui-text); background: rgba(255,255,255,.08); border: 1px solid var(--ui-border); border-radius: 9px; padding: 9px 12px; margin: 8px 6px 0 0; cursor: pointer; }
  #err { position: fixed; top: 8px; left: 8px; right: 8px; color: #ffb4b4; font: 12px/1.4 monospace; pointer-events: none; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<div id="err" hidden></div>
<div id="panel"><div>
  <b>Layout</b> — copy this text to keep your fit, or paste a saved one and press Apply.
  <textarea id="json" spellcheck="false"></textarea>
  <button id="jCopy">Copy</button><button id="jApply">Apply</button><button id="jClose">Close</button>
  <span id="jMsg"></span>
</div></div>
<div id="ui">
  <button id="mEdit" aria-pressed="true" title="Drag corners (E)">Edit</button>
  <button id="mTest" aria-pressed="false" title="Bright panels to line up (T)">Test</button>
  <button id="mPlay" aria-pressed="false" title="Show the journey (P)">Play</button>
  <span class="sep"></span>
  <button id="bAdd">+ Surface</button>
  <button id="bDel">− Surface</button>
  <span class="sep"></span>
  <span class="lbl">Art / ground</span>
  <button id="bSmall" title="Smaller picture">−</button><button id="bBig" title="Bigger picture">+</button>
  <button id="bUp" title="Raise the ground line the characters stand on">▲</button><button id="bDown" title="Lower the ground line">▼</button>
  <span class="lbl">Tall</span>
  <button id="bTall0" title="Characters less tall">−</button><button id="bTall1" title="Characters taller: use when the projector squashes the picture">+</button>
  <span class="lbl">Edge</span>
  <button id="bIn0" title="Smaller inset">−</button><button id="bIn1" title="Pull edges inward to avoid light spill">+</button>
  <span class="sep"></span>
  <button id="bPrev">◀ Scene</button><button id="bNext">Scene ▶</button><button id="bPlay">⏸ Pause</button>
  <span class="sep"></span>
  <button id="bJson">Layout…</button>
  <button id="bRec">⏺ Record video</button>
  <button id="bFull">⛶ Fullscreen</button>
  <button id="bLook" title="Night: only light is shown, for the wall. Day: painted sky, for a screen.">Look: Night</button>
  <button id="bView" title="Switch between the band above the doors and separate door windows">View: Frieze</button>
  <button id="bReset">Reset</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- constants ----------
  const PW = 1200, PH = 400, GY = 345;        // one scene is 1200 x 400 (3:1); ground line at y = 345
  // Night look (default): a projector can only add light, so figures are drawn as lit gold shapes on black and the sky is not drawn at all.
  // Day look: dark silhouettes against a painted sky (for a screen, not a wall).
  let INK = '#0a0409', DIM = INK, MID = INK, RAV = INK, NIGHT = false;
  function setLook(night) {
    NIGHT = night;
    if (night) { INK = '#ffd48a'; DIM = '#5e3412'; MID = '#a8652a'; RAV = '#ff6a3a'; }
    else { INK = '#0a0409'; DIM = MID = RAV = INK; }
  }
  const HOLD = 11, PAN = 2.5, SEG = HOLD + PAN, NP = 5;
  const LOOP = (NP - 1) * SEG + HOLD + PAN;   // 67.5 s
  const GOLD = '#ffcf70';

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------- state ----------
  let W = 0, H = 0, DPR = 1;
  let T = 0, paused = false, flash = 0;
  let fired = {}, parts = [];
  const query = new URLSearchParams(location.search);

  // Surfaces are four-corner shapes in the projector picture, as fractions of its width and height.
  // The default layout is a first guess from the room video: left door, the wall between, right door.
  // 'frieze': one long band in the gap between the ceiling and the tops of the doors, all five scenes side by side.
  // 'doors':  separate windows on the left door, the wall and the right door, with the story panning across them.
  const SURFACES = {
    frieze: () => [{ name: 'Above doors', pts: [[.012, .01], [.988, .01], [.988, .145], [.012, .145]] }],
    doors: () => [
      { name: 'Left door',  pts: [[.081, .214], [.308, .219], [.308, .99], [.081, .99]] },
      { name: 'Wall',       pts: [[.337, .02], [.685, .02], [.685, .98], [.337, .98]] },
      { name: 'Right door', pts: [[.702, .223], [.885, .227], [.885, .99], [.702, .99]] },
    ],
  };
  const PRESET = {
    frieze: { win: 6320, ground: .122, vstretch: 2, inset: 1 },
    doors:  { win: 1400, ground: .92,  vstretch: 2, inset: 2 },
  };
  const cfg = { view: 'frieze', look: 'night', surfaces: SURFACES.frieze(), ...PRESET.frieze, captions: false };
  const applyPreset = (v) => { cfg.view = v; cfg.surfaces = SURFACES[v](); Object.assign(cfg, PRESET[v]); };
  const validLayout = (o) => o && Array.isArray(o.surfaces) && o.surfaces.length > 0 && o.surfaces.every(s =>
    s && Array.isArray(s.pts) && s.pts.length === 4 && s.pts.every(p => Array.isArray(p) && isFinite(p[0]) && isFinite(p[1])));
  const applyLayout = (o) => {
    if (!validLayout(o)) return false;
    cfg.surfaces = o.surfaces.map((s, i) => ({ name: String(s.name || 'Surface ' + (i + 1)).slice(0, 30), pts: s.pts.map(p => [+p[0], +p[1]]) }));
    cfg.view = o.view in SURFACES ? o.view : 'doors';
    cfg.look = o.look === 'day' ? 'day' : 'night';
    for (const k of ['win', 'ground', 'vstretch', 'inset']) if (isFinite(o[k])) cfg[k] = +o[k];
    return true;
  };
  const layoutJSON = () => JSON.stringify({ view: cfg.view, look: cfg.look, surfaces: cfg.surfaces, win: Math.round(cfg.win), ground: Math.round(cfg.ground * 1000) / 1000, vstretch: Math.round(cfg.vstretch * 100) / 100, inset: cfg.inset });
  try { applyLayout(JSON.parse(localStorage.getItem('wall-map-v1') || 'null')); } catch (_) {}
  const saveCfg = () => { try { localStorage.setItem('wall-map-v1', layoutJSON()); } catch (_) {} };
  try { const h = location.hash.match(/layout=([^&]+)/); if (h) applyLayout(JSON.parse(atob(decodeURIComponent(h[1])))); } catch (_) {}

  // ---------- palettes (top, middle, bottom) per scene ----------
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const PAL = [
    ['#2b1a4a', '#d4603a', '#ffcf70'],  // dawn in Ayodhya
    ['#3b1d5a', '#b3475a', '#f6a35a'],  // court of Mithila
    ['#14243a', '#6b4a5a', '#e6a055'],  // forest dusk
    ['#12040c', '#7a1620', '#ff7a2a'],  // Lanka night
    ['#05030f', '#2a1250', '#ff9a3c'],  // Diwali night
  ].map(p => p.map(hex));
  const STARS = [0.05, 0.1, 0.25, 0.7, 1];

  const mixc = (a, b, t) => `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;

  function drawBackground(x0, x1) {
    if (NIGHT) return;   // no sky: nothing is projected where there is no light
    const step = Math.max(12, Math.round((x1 - x0) / 180));
    for (let x = x0 - (x0 % step) - step; x < x1 + step; x += step) {
      const u = clamp((x + step / 2) / PW - 0.5, 0, NP - 1);
      const j = Math.min(NP - 2, Math.floor(u));
      const f = sstep(0.3, 0.7, u - j);
      const g = ctx.createLinearGradient(0, 0, 0, PH);
      g.addColorStop(0, mixc(PAL[j][0], PAL[j + 1][0], f));
      g.addColorStop(0.62, mixc(PAL[j][1], PAL[j + 1][1], f));
      g.addColorStop(GY / PH, mixc(PAL[j][2], PAL[j + 1][2], f));
      g.addColorStop(1, '#000');
      ctx.fillStyle = mixc(PAL[j][0], PAL[j + 1][0], f);
      ctx.fillRect(x, -1500, step + 3, 1500);   // sky continues above the scene
      ctx.fillStyle = g;
      ctx.fillRect(x, 0, step + 3, PH);
    }
  }

  // stars across the whole world
  const stars = Array.from({ length: 260 }, () => ({
    x: Math.random() * PW * NP, y: rand(-420, 250), r: Math.random() < .9 ? rand(.5, 1.2) : rand(1.2, 2),
    ph: Math.random() * 6.28, sp: rand(.6, 2),
  }));
  function drawStars(x0, x1, t) {
    if (NIGHT) return;
    for (const s of stars) {
      if (s.x < x0 - 5 || s.x > x1 + 5) continue;
      const u = clamp(s.x / PW - 0.5, 0, NP - 1), j = Math.min(NP - 2, Math.floor(u));
      const base = lerp(STARS[j], STARS[j + 1], sstep(.3, .7, u - j));
      if (base < .03) continue;
      ctx.globalAlpha = base * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
      ctx.fillStyle = '#fff5e1';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- drawing helpers ----------
  function glow(x, y, r, col, a) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill(); ctx.restore();
  }
  function celestial(x, y, r, fill, gcol) {
    if (NIGHT) r *= .6;
    glow(x, y, r * 4.5, gcol, NIGHT ? .3 : .45);
    ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
  function ground() {
    if (NIGHT) {   // only a thin glowing line, so the characters have something to stand on
      const g = ctx.createLinearGradient(0, GY, 0, GY + 14);
      g.addColorStop(0, 'rgba(255,170,70,.75)'); g.addColorStop(1, 'rgba(255,170,70,0)');
      ctx.fillStyle = g; ctx.fillRect(-2, GY, PW + 4, 14); return;
    }
    ctx.fillStyle = INK;
    ctx.fillRect(-2, GY, PW + 4, 900);
  }

  // A person as a shadow-puppet silhouette. Origin is at the feet, facing right (flip to face left).
  function figure(x, y, s, o) {
    o = o || {}; s *= cfg.view === 'frieze' ? .8 : 1;
    const dir = o.flip ? -1 : 1;
    const w = o.walk || 0, mv = !!o.moving;
    const sw = mv ? Math.sin(w) : 0;
    const bob = mv ? Math.abs(Math.cos(w)) * 3 : 0;
    ctx.save();
    ctx.translate(x, y - bob * s);
    ctx.scale(s * dir, s);
    ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    ctx.lineWidth = 10;
    for (const g of [1, -1]) { ctx.beginPath(); ctx.moveTo(g * 4, -72 + bob); ctx.lineTo(g * 4 + g * sw * 24, bob); ctx.stroke(); }
    const hem = o.female ? -6 : -30, wd = o.female ? 21 : 16;
    ctx.beginPath(); ctx.moveTo(-11, -82); ctx.lineTo(11, -82); ctx.lineTo(wd + sw * 3, hem + bob); ctx.lineTo(-wd + sw * 3, hem + bob); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-14, -120); ctx.lineTo(14, -120); ctx.lineTo(10, -80); ctx.lineTo(-10, -80); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -118); ctx.lineTo(0, -125); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -134, 10, 0, 6.283); ctx.fill();
    if (o.crown) {
      ctx.beginPath(); ctx.moveTo(-9, -140); ctx.lineTo(-7, -156); ctx.lineTo(-3, -147); ctx.lineTo(0, -162);
      ctx.lineTo(3, -147); ctx.lineTo(7, -156); ctx.lineTo(9, -140); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 1.2; ctx.stroke(); ctx.strokeStyle = INK;
    }
    if (o.female) { ctx.beginPath(); ctx.arc(-9, -139, 6, 0, 6.283); ctx.fill(); }

    // arms
    let fh = [14 + sw * 9, -86], bh = [-14 - sw * 9, -86];
    const d = o.bow;
    if (d !== undefined) { fh = [38, -112]; bh = d > 0.02 ? [38 - 30 * d, -112] : [18, -98]; }
    if (o.hands) { fh = o.hands[0]; bh = o.hands[1]; }
    ctx.lineWidth = 8;
    for (const [sh, h] of [[[-10, -114], bh], [[10, -114], fh]]) {
      ctx.beginPath(); ctx.moveTo(sh[0], sh[1]);
      ctx.quadraticCurveTo((sh[0] + h[0]) / 2, (sh[1] + h[1]) / 2 + 7, h[0], h[1]); ctx.stroke();
    }

    if (d !== undefined) {
      const z = o.bowSize || 1, hx = 38, hy = -112, tx = hx - 8 * d * z, t1 = hy - 46 * z, t2 = hy + 46 * z;
      ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tx, t1); ctx.quadraticCurveTo(hx + 36 * z, hy, tx, t2); ctx.stroke();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 1.2; ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(tx, t1); ctx.lineTo(hx - 30 * d, hy); ctx.lineTo(tx, t2); ctx.stroke();
      if (o.arrow) {
        const bx = hx - 30 * d;
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, hy); ctx.lineTo(hx + 14, hy); ctx.stroke();
        ctx.fillStyle = GOLD; ctx.beginPath(); ctx.moveTo(hx + 20, hy); ctx.lineTo(hx + 11, hy - 3.5); ctx.lineTo(hx + 11, hy + 3.5); ctx.closePath(); ctx.fill();
      }
    }
    if (o.garland) {
      ctx.strokeStyle = '#ff9d1c'; ctx.lineWidth = 5; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.ellipse(20, -92, 14, 18, 0, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    }
    if (o.necklace) {
      ctx.strokeStyle = '#ff9d1c'; ctx.lineWidth = 4; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.ellipse(0, -112, 13, 15, 0, 0.1, Math.PI - 0.1); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function seated(x, y, s, crown) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = MID;
    ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(16, 0); ctx.lineTo(7, -32); ctx.lineTo(-7, -32); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -40, 8, 0, 6.283); ctx.fill();
    if (crown) { ctx.beginPath(); ctx.moveTo(-6, -46); ctx.lineTo(-4, -58); ctx.lineTo(0, -50); ctx.lineTo(4, -58); ctx.lineTo(6, -46); ctx.fill(); }
    ctx.restore();
  }

  function ravan(x, y, s, t, alpha, squash) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s * squash); ctx.globalAlpha = alpha;
    ctx.fillStyle = RAV; ctx.strokeStyle = RAV; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 14; for (const g of [1, -1]) { ctx.beginPath(); ctx.moveTo(g * 9, -72); ctx.lineTo(g * 14, 0); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-17, -84); ctx.lineTo(17, -84); ctx.lineTo(24, -26); ctx.lineTo(-24, -26); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-30, -122); ctx.lineTo(30, -122); ctx.lineTo(15, -80); ctx.lineTo(-15, -80); ctx.closePath(); ctx.fill();
    // six arms with swords
    ctx.lineWidth = 7;
    const arms = [[-48, -150], [48, -150], [-60, -108], [60, -108], [-42, -78], [42, -78]];
    arms.forEach(([hx, hy], i) => {
      const g = hx < 0 ? -1 : 1, sx = g * 26, sy = -116 + (i > 3 ? 14 : 0);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo((sx + hx) / 2, (sy + hy) / 2 - 8, hx, hy); ctx.stroke();
      ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + g * 6, hy - 30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hx - 6, hy - 3); ctx.lineTo(hx + 6, hy - 3); ctx.stroke(); ctx.lineWidth = 7;
    });
    // ten heads: centre head and a fan of nine
    const heads = [[0, -142, 12]];
    for (let k = 0; k < 9; k++) {
      const th = Math.PI + 0.32 + (k / 8) * (Math.PI - 0.64);
      heads.push([Math.cos(th) * 48, -138 + Math.sin(th) * 44 - 4, 8.5]);
    }
    for (const [hx, hy, r] of heads) {
      const sway = Math.sin(t * 1.6 + hx * .1) * 1.5;
      ctx.beginPath(); ctx.arc(hx + sway, hy, r, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.moveTo(hx + sway - r, hy - r * .6); ctx.lineTo(hx + sway - r * .5, hy - r * 1.9); ctx.lineTo(hx + sway, hy - r * 1.2);
      ctx.lineTo(hx + sway + r * .5, hy - r * 1.9); ctx.lineTo(hx + sway + r, hy - r * .6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = GOLD; ctx.lineWidth = 1; ctx.stroke(); ctx.strokeStyle = RAV;
      glow(hx + sway - r * .35, hy, 4, '255,60,30', 0.9); glow(hx + sway + r * .35, hy, 4, '255,60,30', 0.9);
    }
    ctx.restore();
  }

  function palace(x, y, s, lit, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = DIM;
    ctx.fillRect(0, -84, 360, 84);
    for (let k = 0; k < 18; k++) ctx.fillRect(k * 20 + 2, -92, 12, 8);
    for (const tx of [26, 300]) {
      ctx.fillRect(tx, -150, 34, 150);
      ctx.beginPath(); ctx.arc(tx + 17, -150, 22, Math.PI, 0); ctx.fill();
      ctx.fillRect(tx + 16, -190, 2, 20);
    }
    ctx.fillRect(140, -175, 80, 175);
    ctx.beginPath(); ctx.arc(180, -175, 44, Math.PI, 0); ctx.fill();
    ctx.fillRect(179, -246, 2.5, 28); ctx.beginPath(); ctx.arc(180, -248, 4, 0, 6.283); ctx.fill();
    ctx.fillStyle = GOLD;
    const win = (wx, wy) => { ctx.globalAlpha = lit * (0.75 + 0.25 * Math.sin(t * 5 + wx)); ctx.beginPath(); ctx.moveTo(wx - 6, wy + 22); ctx.lineTo(wx - 6, wy + 6); ctx.arc(wx, wy + 6, 6, Math.PI, 0); ctx.lineTo(wx + 6, wy + 22); ctx.fill(); };
    for (let k = 0; k < 8; k++) if (k !== 3 && k !== 4) win(20 + k * 45, -62);
    win(180, -150); win(160, -110); win(200, -110);
    ctx.globalAlpha = 1; ctx.restore();
  }

  function tree(x, h, a, w) {
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = DIM;
    ctx.beginPath(); ctx.moveTo(x - w * .09, GY); ctx.lineTo(x - w * .05, GY - h); ctx.lineTo(x + w * .05, GY - h); ctx.lineTo(x + w * .09, GY); ctx.fill();
    for (const [dx, dy, r] of [[0, 0, .42], [-.34, .08, .32], [.34, .06, .34], [-.16, -.16, .3], [.2, -.18, .3]]) {
      ctx.beginPath(); ctx.arc(x + dx * w, GY - h + dy * w, r * w, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

      celestial(1030, 92, 34, '#fff4dc', '255,240,210');
      palace(640, GY, 1.4, 1, t);
      for (let k = 0; k < 9; k++) lantern(110 + k * 125, GY - (((lt * 20 + k * 61) % 420)), 13 + (k % 3) * 4, sstep(.5, 2, lt) * clamp((GY - (((lt * 20 + k * 61) % 420))) / 90), t, k);
      ground();
      for (let k = 0; k < 24; k++) diya(30 + k * 50, GY + 2 + (k % 2) * 3, sstep(.4 + k * .22, .8 + k * .22, lt), t, k);
      const arrive = sstep(0.8, 6.0, lt), wp = lerp(-300, 520, arrive), mv = lt > .8 && lt < 6.0, ph = lt * 7;
      figure(wp, GY, 1.2, { crown: true, walk: ph, moving: mv });
      figure(wp - 100, GY, 1.1, { female: true, walk: ph + 1, moving: mv });
      figure(wp - 205, GY, 1.15, { crown: true, walk: ph + 2, moving: mv });
      if (lt > 6) glow(480, GY - 130, 190 * sstep(6, 8, lt), '255,210,130', .3);
      const ta = sstep(8.3, 9.5, lt) * (1 - sstep(11.6, 12.6, lt));
      if (ta > 0) {
        ctx.save(); ctx.globalAlpha = ta; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const fz = cfg.view === 'frieze';
        ctx.font = (fz ? '700 36px' : '700 64px') + ' "Noto Sans Devanagari", "Mangal", Georgia, serif';
        ctx.shadowColor = 'rgba(255,170,60,.95)'; ctx.shadowBlur = 26; ctx.fillStyle = '#ffe9b0';
        ctx.fillText('शुभ दीपावली', fz ? 880 : 650, fz ? 196 : 100);
        ctx.font = (fz ? '600 20px' : '600 28px') + ' Georgia, serif'; ctx.shadowBlur = 12; ctx.fillStyle = GOLD; ctx.fillText('Happy Diwali', fz ? 880 : 650, fz ? 232 : 150);
        ctx.restore();
      }
      caption(lt, 'Ayodhya · Ram returns, Diwali begins', 'दीपावली');
    }
    ctx.restore();
  }

  // ---------- layout and loop ----------
  let mode = 'edit', sel = 0;
  const modeBtn = { edit: document.getElementById('mEdit'), test: document.getElementById('mTest'), play: document.getElementById('mPlay') };
  const hint = document.getElementById('hint'), ui = document.getElementById('ui');
  const HINTS = {
    edit: 'Edit: drag the corner dots so the shape sits exactly in the space you want to light (the gap between the ceiling and the doors). Drag inside a shape to move it. + Surface adds more.',
    test: 'Test: bright panel. Line it up with the real gap above the doors. The circle should look round on the wall. If it looks wide, press Tall +. Then press Play.',
    play: '',
  };
  function setMode(m) {
    mode = m; for (const k in modeBtn) modeBtn[k].setAttribute('aria-pressed', k === m);
    hint.textContent = HINTS[m]; hint.classList.toggle('hidden', !HINTS[m]);
  }

  function resize() {
    W = canvas.clientWidth || window.innerWidth; H = canvas.clientHeight || window.innerHeight;
    if (!W || !H) return;
    DPR = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(4.2e6 / (W * H)));
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  }

  // pixel polygons, pulled inward a little so light does not spill past the edge of a door
  function polys() {
    return cfg.surfaces.map((s) => {
      const pts = s.pts.map((p) => [p[0] * W, p[1] * H]);
      if (cfg.inset <= 0) return pts;
      const cx = pts.reduce((a, p) => a + p[0], 0) / 4, cy = pts.reduce((a, p) => a + p[1], 0) / 4;
      return pts.map(([x, y]) => { const dx = cx - x, dy = cy - y, d = Math.hypot(dx, dy) || 1, m = Math.min(cfg.inset, d * .4); return [x + dx / d * m, y + dy / d * m]; });
    });
  }
  function clipTo(P) {
    ctx.beginPath();
    for (const q of P) { ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(q[i][0], q[i][1]); ctx.closePath(); }
    ctx.clip();
  }

  // The journey: only the scene in progress is lit. Each scene fades in as the story reaches it and fades out as it moves on;
  // everything else, including the empty margins, stays dark (no light on the wall).
  const sceneWeight = (i) => sstep(i * SEG - 2.3, i * SEG - 0.8, T) * (1 - sstep(i * SEG + 10.8, i * SEG + 12.3, T));
  function sceneShade(x0, x1) {
    ctx.fillStyle = '#000';
    if (x0 < 0) ctx.fillRect(x0, -1500, -x0, 2400);
    if (x1 > NP * PW) ctx.fillRect(NP * PW, -1500, x1 - NP * PW, 2400);
    for (let i = 0; i < NP; i++) {
      const a = 1 - sceneWeight(i);
      if (a > 0.003) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, a).toFixed(3)})`; ctx.fillRect(i * PW - 1, -1500, PW + 2, 2400); }
    }
  }

  function drawWorld(P) {
    const fr = cfg.view === 'frieze';
    const k = W / cfg.win, c = fr ? 3000 : camCenter(), x0 = c - cfg.win / 2, x1 = c + cfg.win / 2;
    ctx.save(); clipTo(P);
    ctx.save();
    ctx.translate(0, cfg.ground * H); ctx.scale(k, k * cfg.vstretch); ctx.translate(-x0, -GY);   // the ground line of the scene sits at cfg.ground of the picture height
    drawBackground(x0, x1); drawStars(x0, x1, T);
    if (fr && !NIGHT) { ctx.fillStyle = INK; ctx.fillRect(x0, GY, x1 - x0, 900); }
    for (let i = 0; i < NP; i++) if (i * PW + PW > x0 && i * PW < x1) drawPanel(i);
    drawParts();
    if (fr) sceneShade(x0, x1);
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(255,236,200,${(flash * (NIGHT ? .2 : .55)).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    const fade = T < 1 ? 1 - T : (T > LOOP - 1.5 ? (T - (LOOP - 1.5)) / 1.5 : 0);
    if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${clamp(fade).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }

  const TEST_COL = ['#ffffff', '#ffe6a8', '#bfe3ff', '#ffc4d6', '#c9f5c0'];
  function drawTest(P) {
    P.forEach((q, n) => {
      ctx.save(); clipTo([q]);
      ctx.fillStyle = TEST_COL[n % TEST_COL.length]; ctx.fillRect(0, 0, W, H);
      const xs = q.map(p => p[0]), ys = q.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.beginPath();
      for (let g = 1; g < 8; g++) { const x = x0 + (x1 - x0) * g / 8, y = y0 + (y1 - y0) * g / 8; ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
      ctx.stroke();
      ctx.fillStyle = '#000'; ctx.font = `600 ${Math.max(14, Math.min(40, (x1 - x0) / 7))}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(cfg.surfaces[n].name, (x0 + x1) / 2, (y0 + y1) / 2);
      // a circle drawn with the same stretch as the story: it should look round on the real wall
      const rr = Math.min(x1 - x0, (y1 - y0) / cfg.vstretch) * .32;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse((x0 + x1) / 2, y0 + (y1 - y0) * .25, rr, rr * cfg.vstretch, 0, 0, 6.283); ctx.stroke();
      ctx.restore();
    });
  }

  function drawEditor(P) {
    ctx.save();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1; ctx.strokeRect(.5, .5, W - 1, H - 1); ctx.setLineDash([]);
    cfg.surfaces.forEach((s, n) => {
      const q = s.pts.map(p => [p[0] * W, p[1] * H]), on = n === sel;
      ctx.strokeStyle = on ? '#3fe0ff' : '#ff9d1c'; ctx.lineWidth = on ? 3 : 2;
      ctx.beginPath(); ctx.moveTo(q[0][0], q[0][1]); for (let i = 1; i < 4; i++) ctx.lineTo(q[i][0], q[i][1]); ctx.closePath(); ctx.stroke();
      for (const p of q) { ctx.fillStyle = on ? '#3fe0ff' : '#ff9d1c'; ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); }
      ctx.fillStyle = on ? '#3fe0ff' : '#ff9d1c'; ctx.font = '600 14px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      const bx = Math.min(...q.map(p => p[0])) + 12, by = Math.min(...q.map(p => p[1])) + 12;
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4; ctx.fillText((n + 1) + ' ' + s.name, bx, by); ctx.shadowBlur = 0;
    });
    ctx.restore();
  }

  function render() {
    setLook(cfg.look !== 'day');
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const P = polys();
    if (mode === 'test') drawTest(P); else drawWorld(P);
    if (mode !== 'play') drawEditor(P);
  }

  const errBox = document.getElementById('err'); let errShown = false, last = null;
  function frame(now) {
    requestAnimationFrame(frame);
    try {
      if (canvas.clientWidth && (canvas.clientWidth !== W || canvas.clientHeight !== H)) resize();
      if (!W || !H) return;
      if (last === null) last = now;
      const dt = Math.min(.05, (now - last) / 1000); last = now;
      if (!paused) update(dt);
      render();
    } catch (e) {
      if (!errShown) { errShown = true; errBox.hidden = false; errBox.textContent = 'Animation error: ' + (e && e.message || e); }
    }
  }

  // ---------- editing with pointer or touch ----------
  const inPoly = (q, x, y) => { let c = false; for (let i = 0, j = 3; i < 4; j = i++) { if (((q[i][1] > y) !== (q[j][1] > y)) && (x < (q[j][0] - q[i][0]) * (y - q[i][1]) / (q[j][1] - q[i][1]) + q[i][0])) c = !c; } return c; };
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    showUI();
    if (mode === 'play') return;
    const x = e.clientX, y = e.clientY;
    let best = null, bd = 34;
    cfg.surfaces.forEach((s, n) => s.pts.forEach((p, i) => { const d = Math.hypot(p[0] * W - x, p[1] * H - y); if (d < bd) { bd = d; best = { n, i }; } }));
    if (best) { sel = best.n; drag = { type: 'corner', n: best.n, i: best.i }; }
    else {
      for (let n = cfg.surfaces.length - 1; n >= 0; n--) {
        const q = cfg.surfaces[n].pts.map(p => [p[0] * W, p[1] * H]);
        if (inPoly(q, x, y)) { sel = n; drag = { type: 'move', n, x, y, start: cfg.surfaces[n].pts.map(p => p.slice()) }; break; }
      }
    }
    if (drag) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    showUI();
    if (!drag) return;
    const s = cfg.surfaces[drag.n];
    if (drag.type === 'corner') { s.pts[drag.i] = [clamp(e.clientX / W, -.05, 1.05), clamp(e.clientY / H, -.05, 1.05)]; }
    else { const dx = (e.clientX - drag.x) / W, dy = (e.clientY - drag.y) / H; s.pts = drag.start.map(p => [p[0] + dx, p[1] + dy]); }
  });
  const endDrag = () => { if (drag) { drag = null; saveCfg(); } };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

  // ---------- controls ----------
  let hideTimer;
  function showUI() {
    ui.classList.remove('hidden'); document.body.classList.remove('hide-cursor'); clearTimeout(hideTimer);
    if (mode === 'play' || recording) hideTimer = setTimeout(() => { ui.classList.add('hidden'); hint.classList.add('hidden'); document.body.classList.add('hide-cursor'); }, 4000);
  }
  function seek(sec) { resetWorld(); T = 0; const step = 1 / 30; const n = Math.round(sec / step); for (let i = 0; i < n; i++) update(step); }
  const jump = (i) => seek(Math.max(0, (((i % NP) + NP) % NP) * SEG));
  const curScene = () => Math.min(NP - 1, Math.floor((T + 1.5) / SEG));
  const $ = (id) => document.getElementById(id);
  const bPlay = $('bPlay');
  const togglePause = () => { paused = !paused; bPlay.textContent = paused ? '▶ Play' : '⏸ Pause'; };
  const setWin = (f) => { cfg.win = clamp(cfg.win * f, 300, 2400); saveCfg(); };
  const setGround = (d) => { cfg.ground = clamp(cfg.ground + d / H, .1, 1.2); saveCfg(); };
  const setTall = (f) => { cfg.vstretch = clamp(cfg.vstretch * f, .5, 4); saveCfg(); };
  const setInset = (d) => { cfg.inset = clamp(cfg.inset + d, 0, 30); saveCfg(); };
  async function toggleFullscreen() {
    try {
      const el = document.documentElement, on = document.fullscreenElement || document.webkitFullscreenElement;
      if (!on) await (el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen());
      else await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
    } catch (_) {}
  }
  modeBtn.edit.onclick = () => setMode('edit'); modeBtn.test.onclick = () => setMode('test'); modeBtn.play.onclick = () => { setMode('play'); showUI(); };
  $('bAdd').onclick = () => { cfg.surfaces.push({ name: 'Surface ' + (cfg.surfaces.length + 1), pts: [[.4, .3], [.6, .3], [.6, .7], [.4, .7]] }); sel = cfg.surfaces.length - 1; saveCfg(); };
  $('bDel').onclick = () => { if (cfg.surfaces.length > 1) { cfg.surfaces.splice(sel, 1); sel = Math.max(0, sel - 1); saveCfg(); } };
  $('bSmall').onclick = () => setWin(1.05); $('bBig').onclick = () => setWin(1 / 1.05);
  $('bUp').onclick = () => setGround(-6); $('bDown').onclick = () => setGround(6);
  $('bTall0').onclick = () => setTall(1 / 1.06); $('bTall1').onclick = () => setTall(1.06);
  $('bIn0').onclick = () => setInset(-1); $('bIn1').onclick = () => setInset(1);
  $('bPrev').onclick = () => jump(curScene() - 1); $('bNext').onclick = () => jump(curScene() + 1);
  bPlay.onclick = togglePause;
  const bView = $('bView');
  const viewLabel = () => { bView.textContent = 'View: ' + (cfg.view === 'frieze' ? 'Frieze' : 'Doors'); };
  bView.onclick = () => { applyPreset(cfg.view === 'frieze' ? 'doors' : 'frieze'); sel = 0; saveCfg(); viewLabel(); };
  $('bReset').onclick = () => { applyPreset(cfg.view); sel = 0; saveCfg(); };
  const bLook = $('bLook');
  const lookLabel = () => { bLook.textContent = 'Look: ' + (cfg.look === 'day' ? 'Day' : 'Night'); };
  bLook.onclick = () => { cfg.look = cfg.look === 'day' ? 'night' : 'day'; saveCfg(); lookLabel(); };
  viewLabel(); lookLabel();
  const bFull = $('bFull'); bFull.onclick = toggleFullscreen;
  if (!document.documentElement.requestFullscreen && !document.documentElement.webkitRequestFullscreen) bFull.style.display = 'none';

  // layout text: copy it, keep it, paste it back
  const panel = $('panel'), jsonBox = $('json'), jMsg = $('jMsg');
  $('bJson').onclick = () => { jsonBox.value = layoutJSON(); jMsg.textContent = ''; panel.classList.add('open'); };
  $('jClose').onclick = () => panel.classList.remove('open');
  $('jApply').onclick = () => { try { if (applyLayout(JSON.parse(jsonBox.value))) { saveCfg(); sel = 0; jMsg.textContent = 'Applied.'; } else jMsg.textContent = 'That text is not a layout.'; } catch (_) { jMsg.textContent = 'That text is not a layout.'; } };
  $('jCopy').onclick = async () => { jsonBox.select(); try { await navigator.clipboard.writeText(jsonBox.value); jMsg.textContent = 'Copied.'; } catch (_) { jMsg.textContent = 'Press Ctrl+C (or long-press, Copy) to copy the selected text.'; } };

  // record one full loop of the journey as a video file
  let recording = false;
  const bRec = $('bRec');
  if (!canvas.captureStream || !window.MediaRecorder) bRec.style.display = 'none';
  bRec.onclick = () => {
    if (recording) return;
    const types = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mimeType = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
    const rec = new MediaRecorder(canvas.captureStream(30), mimeType ? { mimeType, videoBitsPerSecond: 12e6 } : {});
    const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      const type = rec.mimeType || 'video/webm', a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(chunks, { type })); a.download = 'ramayan-wall.' + (type.includes('mp4') ? 'mp4' : 'webm'); a.click();
      recording = false; bRec.textContent = '⏺ Record video'; bRec.classList.remove('rec');
    };
    setMode('play'); paused = false; bPlay.textContent = '⏸ Pause'; seek(0);
    recording = true; bRec.classList.add('rec'); showUI(); rec.start(1000);
    const t0 = performance.now(), iv = setInterval(() => {
      const left = Math.ceil(LOOP + 0.5 - (performance.now() - t0) / 1000);
      bRec.textContent = '● Recording ' + Math.max(0, left) + 's';
      if (left <= 0) { clearInterval(iv); rec.stop(); }
    }, 500);
  };

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (e.target && e.target.tagName === 'TEXTAREA') return;
    if (k === 'e' || k === 'E') setMode('edit'); else if (k === 't' || k === 'T') setMode('test'); else if (k === 'p' || k === 'P') setMode('play');
    else if (k === 'f' || k === 'F') toggleFullscreen();
    else if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k >= '1' && k <= '5') jump(+k - 1);
    else if (mode !== 'play' && k.startsWith('Arrow')) {
      const s = cfg.surfaces[sel], d = (e.shiftKey ? .02 : .004), dx = k === 'ArrowLeft' ? -d : k === 'ArrowRight' ? d : 0, dy = k === 'ArrowUp' ? -d : k === 'ArrowDown' ? d : 0;
      s.pts = s.pts.map(p => [p[0] + dx, p[1] + dy]); saveCfg(); e.preventDefault();
    } else return;
    showUI();
  });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 300));
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(canvas);
  async function wake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (_) {} }
  document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake());
  wake();

  setMode(query.has('play') ? 'play' : (query.get('mode') || 'edit'));
  resize();
  if (query.has('t')) seek(parseFloat(query.get('t')) || 0);
  if (query.has('hold')) paused = true;
  showUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
